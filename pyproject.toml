[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "review-sheep"
version = "0.1.1"
description = "Review Sheep — An AI agent that reviews pull requests before they join the flock."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Chih-Yang Li", email = "taipingeric@gmail.com" },
]
keywords = ["code-review", "github", "langchain", "langgraph", "pull-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "deepagents>=0.7.4,<0.8.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langgraph>=1.2.10,<2.0.0",
    "pygithub>=2.9.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/taipingeric/review_sheep"
Repository = "https://github.com/taipingeric/review_sheep"
Issues = "https://github.com/taipingeric/review_sheep/issues"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.5.4,<2.0.0",
]

openai = [
    "langchain-openai>=1.4.1",
    "openai>=2.52.0",
]

tracing = [
    "langfuse>=4.0.0,<5.0.0",
    "mlflow>=3.15.1,<4.0.0",
]

dev = [
    "langfuse>=4.0.0,<5.0.0",
    "mlflow>=3.15.1,<4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
