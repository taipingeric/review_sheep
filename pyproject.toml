[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "review-sheep"
version = "0.1.0"
description = "Review Sheep — An AI agent that reviews pull requests before they join the flock."
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "langchain>=1.3.14",
    "langchain-core>=1.2.0",
    "langgraph>=1.0.0",
    "pygithub>=2.9.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.4.1",
    "openai>=2.52.0",
]

anthropic = [
    "langchain-anthropic>=1.0.0",
    "anthropic>=0.70.0",
]

gemini = [
    "langchain-google-genai>=4.0.0",
    "google-genai>=1.0.0",
]

all = [
    "review-sheep[openai,anthropic,gemini]",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
