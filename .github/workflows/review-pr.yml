name: Review Sheep reusable PR review

on:
  workflow_call:
    inputs:
      review_sheep_ref:
        description: Branch, tag, or SHA used to download Review Sheep.
        required: false
        default: main
        type: string
      model_tier:
        description: Anthropic model tier to use (haiku, sonnet, or opus).
        required: false
        default: sonnet
        type: string
      instructions:
        description: Optional additional Review instructions.
        required: false
        default: ""
        type: string
      anthropic_base_url:
        description: Non-secret Anthropic-compatible gateway endpoint.
        required: false
        default: ""
        type: string
      haiku_model:
        description: Gateway model ID for the Haiku tier.
        required: false
        default: ""
        type: string
      opus_model:
        description: Gateway model ID for the Opus tier.
        required: false
        default: ""
        type: string
      sonnet_model:
        description: Gateway model ID for the Sonnet tier.
        required: false
        default: ""
        type: string
    secrets:
      ANTHROPIC_AUTH_TOKEN:
        description: Bearer token for the Anthropic-compatible gateway.
        required: true
      ANTHROPIC_BASE_URL:
        description: Secret gateway endpoint fallback when the input is empty.
        required: false
      ANTHROPIC_CUSTOM_HEADERS:
        description: Optional newline-separated custom request headers.
        required: false
      ANTHROPIC_DEFAULT_HAIKU_MODEL:
        description: Gateway model ID for the Haiku tier.
        required: false
      ANTHROPIC_DEFAULT_OPUS_MODEL:
        description: Gateway model ID for the Opus tier.
        required: false
      ANTHROPIC_DEFAULT_SONNET_MODEL:
        description: Gateway model ID for the Sonnet tier.
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head with full history
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: review-target

      - name: Download Review Sheep
        uses: actions/checkout@v7
        with:
          repository: taipingeric/review_sheep
          ref: ${{ inputs.review_sheep_ref }}
          persist-credentials: false
          path: review-sheep

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: review-sheep

      - name: Review pull request
        shell: bash
        working-directory: review-sheep
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url || secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_CUSTOM_HEADERS }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.haiku_model || secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.opus_model || secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.sonnet_model || secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_CHECKOUT: ${{ github.workspace }}/review-target
          REVIEW_INSTRUCTIONS: ${{ inputs.instructions }}
          REVIEW_MODEL_TIER: ${{ inputs.model_tier }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          uv run python scripts/review_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$REVIEW_PR_NUMBER" \
            --checkout "$REVIEW_CHECKOUT" \
            --instructions "$REVIEW_INSTRUCTIONS" \
            --model-tier "$REVIEW_MODEL_TIER" \
            | tee "$RUNNER_TEMP/review-sheep-report.md"
          cat "$RUNNER_TEMP/review-sheep-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Review Sheep PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_file="$RUNNER_TEMP/review-sheep-comment.md"
          comment_ids_file="$RUNNER_TEMP/review-sheep-comment-ids.txt"
          {
            echo '<!-- review-sheep-report -->'
            cat "$RUNNER_TEMP/review-sheep-report.md"
          } > "$comment_file"

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$REVIEW_PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-sheep-report -->"))) | .id' \
            > "$comment_ids_file"

          if [[ -s "$comment_ids_file" ]]; then
            comment_id="$(tail -n 1 "$comment_ids_file")"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F "body=@$comment_file"
          else
            gh pr comment "$REVIEW_PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$comment_file"
          fi
