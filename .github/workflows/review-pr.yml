name: Review Sheep reusable PR review

on:
  workflow_call:
    inputs:
      review_sheep_ref:
        description: Branch, tag, or SHA used to download Review Sheep.
        required: false
        default: main
        type: string
      model:
        description: OpenAI-compatible model name.
        required: true
        type: string
      base_url:
        description: Optional OpenAI-compatible API base URL.
        required: false
        default: ""
        type: string
      instructions:
        description: Optional additional Review instructions.
        required: false
        default: ""
        type: string
    secrets:
      openai_api_key:
        description: API key for the configured model gateway.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head with full history
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: review-target

      - name: Download Review Sheep
        uses: actions/checkout@v7
        with:
          repository: taipingeric/review_sheep
          ref: ${{ inputs.review_sheep_ref }}
          persist-credentials: false
          path: review-sheep

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: review-sheep

      - name: Review pull request
        shell: bash
        working-directory: review-sheep
        env:
          BASE_URL: ${{ inputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          OPENAI_MODEL: ${{ inputs.model }}
          REVIEW_CHECKOUT: ${{ github.workspace }}/review-target
          REVIEW_INSTRUCTIONS: ${{ inputs.instructions }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          uv run --extra openai python scripts/review_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$REVIEW_PR_NUMBER" \
            --checkout "$REVIEW_CHECKOUT" \
            --instructions "$REVIEW_INSTRUCTIONS" \
            | tee "$RUNNER_TEMP/review-sheep-report.md"
          cat "$RUNNER_TEMP/review-sheep-report.md" >> "$GITHUB_STEP_SUMMARY"
